<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="theme-color" content="#000000">
        <title>Fire HD Dashboard</title>
        <style>
            body {
                background: #000000;
                color: white;
                font-family: Helvetica, sans-serif;
                text-align: center;
                padding: 20px;
            }
            #clock {
                font-size: 76px;
                font-weight: bold;
                margin-top: 30px;
                letter-spacing: 3px;
            }
            #date {
                color: #999999;
                font-size: 18px;
                margin-top: 10px;
            }
            .panel {
                background: #181818;
                box-sizing: border-box;
                flex: 1 1 280px;
                margin: 8px;
                padding: 24px;
                min-height: 140px;
                border-radius: 14px;
                text-align: left;
            }
            .dashboard {
                display: flex;
                flex-wrap: wrap;
                margin: 20px -8px;
            }
            .panel h2 {
                color: #C49A6C;
                margin-top: 0;
                margin-bottom: 16px;
            }
            .panel p {
                color: #AAAAAA;
                font-size: 16px;
            }
            .clock-container {
                text-align: center;
                margin: 35px 0 45px;
            }
            .weather-heading {
                color: #C49A6C;
                font-size: 18px;
                margin: 0 0 18px;
            }

            .weather-main {
                display: flex;
                align-items: center;
                gap: 16px;
            }

            .weather-icon {
                font-size: 42px;
            }

            .weather-temp {
                font-size: 38px;
                font-weight: bold;
            }

            .weather-feels {
                color: #999999;
                margin-top: 12px;
                font-size: 15px;
            }
            #calendar-events {
                margin-top: 18px;
            }

            .calendar-event {
                background: #222;
                border-left: 3px solid #C49A6C;
                border-radius: 8px;
                padding: 12px 14px;
                margin-bottom: 10px;
            }

            .calendar-event strong {
                display: block;
                color: white;
                font-size: 15px;
                margin-bottom: 5px;
            }

            .calendar-event .event-time {
                color: #aaa;
                font-size: 12px;
            }
        </style>
    </head>
    <body>
        <div class="clock-container">
            <div id="clock">00:00:00</div>
            <div id="date">Loading date...</div>
        </div>

        <div class="dashboard">
            <div class="panel">
                <h2>Weather · Middletown, NJ</h2>
                <div id="weather">Loading weather...</div>
            </div>
            <div class="panel">
                <h2>Calendar</h2>
                <button id="connect-calendar" onclick="connectCalendar()">Connect Google Calendar</button>
                <div id="calendar-events">
                    Not connected
                </div>
            </div>
            <div class="panel">
                <h2>Discord</h2>
                <p>Coming soon</p>
            </div>
        </div>

        <script>
            function updateClock() {
                const now = new Date();
                document.getElementById("clock").textContent = now.toLocaleTimeString();
                document.getElementById("date").textContent = 
                                                                now.toLocaleDateString([], {
                                                                    weekday: "long",
                                                                    month: "long",
                                                                    day: "numeric"
                                                                });
            }
            function loadWeather() {
                var request = new XMLHttpRequest();

                // Find Middletown, New Jersey
                request.open(
                    "GET",
                    "https://geocoding-api.open-meteo.com/v1/search?name=Middletown&count=10&countryCode=US&language=en&format=json",
                    true
                );

                request.onload = function () {
                    if (request.status !== 200) {
                        showWeatherError();
                        return;
                    }

                    var locations = JSON.parse(request.responseText).results || [];
                    var location = null;

                    for (var i = 0; i < locations.length; i++) {
                        if (locations[i].admin1 === "New Jersey") {
                            location = locations[i];
                            break;
                        }
                    }

                    if (!location) {
                        showWeatherError();
                        return;
                    }

                    getForecast(location.latitude, location.longitude);
                };

                request.onerror = showWeatherError;
                request.send();
            }

            
            function getForecast(latitude, longitude) {
                var url = "https://api.open-meteo.com/v1/forecast"
                    + "?latitude=" + latitude
                    + "&longitude=" + longitude
                    + "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m"
                    + "&daily=temperature_2m_max,temperature_2m_min"
                    + "&temperature_unit=fahrenheit"
                    + "&wind_speed_unit=mph"
                    + "&timezone=America%2FNew_York";

                var request = new XMLHttpRequest();
                request.open("GET", url, true);

                request.onload = function () {
                    if (request.status !== 200) {
                        showWeatherError();
                        return;
                    }

                    var data = JSON.parse(request.responseText);
                    var current = data.current;

                    var icon = getWeatherIcon(current.weather_code);

                    document.getElementById("weather").innerHTML =
                        "<div class='weather-main'>"
                        + "<span class='weather-icon'>" + icon + "</span>"
                        + "<span class='weather-temp'>"
                        + Math.round(current.temperature_2m) + "°F</span>"
                        + "</div>"
                        + "<div class='weather-feels'>Feels like "
                        + Math.round(current.apparent_temperature) + "°F</div>";
                };

                request.onerror = showWeatherError;
                request.send();
            }

            function getWeatherIcon(code) {
                if (code === 0) return "☀️";
                if (code <= 2) return "⛅";
                if (code === 3) return "☁️";
                if (code <= 48) return "🌫️";
                if (code <= 57) return "🌦️";
                if (code <= 67) return "🌧️";
                if (code <= 77) return "❄️";
                if (code <= 82) return "🌧️";
                if (code <= 86) return "🌨️";
                return "⛈️";
            }
            function getWeatherDescription(code) {
                if (code === 0) return "Clear sky";
                if (code === 1) return "Mainly clear";
                if (code === 2) return "Partly cloudy";
                if (code === 3) return "Overcast";
                if (code === 45 || code === 48) return "Foggy";
                if (code >= 51 && code <= 57) return "Drizzle";
                if (code >= 61 && code <= 67) return "Rain";
                if (code >= 71 && code <= 77) return "Snow";
                if (code >= 80 && code <= 82) return "Rain showers";
                if (code >= 85 && code <= 86) return "Snow showers";
                if (code >= 95) return "Thunderstorms";
                return "Conditions unavailable";
            }

            function showWeatherError() {
                document.getElementById("weather").textContent =
                    "Weather unavailable. Check your internet connection.";
            }
            updateClock();
            setInterval(updateClock, 1000);
            loadWeather();
            setInterval(loadWeather, 30 * 60 * 1000);
        </script>
        <script src="https://accounts.google.com/gsi/client"></script>
        <script> 
            var tokenClient;

            function connectCalendar() {
                if (!tokenClient) {
                    tokenClient = google.accounts.oauth2.initTokenClient({
                        client_id: "439850512639-apkqafjrv4tna2amnplcrka3b555s5n2.apps.googleusercontent.com",
                        scope: "https://www.googleapis.com/auth/calendar.events.readonly",

                        callback: function (response) {
                            if (response.error || !response.access_token) {
                                document.getElementById("calendar-events").textContent =
                                    "Authorization failed. Please try again.";
                                return;
                            }

                            document.getElementById("calendar-events").textContent =
                                "Loading events...";

                            getCalendarEvents(response.access_token);
                        }
                    });
                }

                tokenClient.requestAccessToken();
            }

            function getCalendarEvents(accessToken) {
                var url = "https://www.googleapis.com/calendar/v3/calendars/primary/events"
                    + "?maxResults=5"
                    + "&orderBy=startTime"
                    + "&singleEvents=true"
                    + "&timeMin=" + encodeURIComponent(new Date().toISOString());

                var request = new XMLHttpRequest();
                request.open("GET", url, true);
                request.setRequestHeader("Authorization", "Bearer " + accessToken);

                request.onload = function () {
                    var container = document.getElementById("calendar-events");

                    if (request.status !== 200) {
                        container.textContent =
                            "Couldn't load events. Error: " + request.status;
                        return;
                    }

                    var data = JSON.parse(request.responseText);
                    container.innerHTML = "";

                    document.getElementById("connect-calendar").style.display = "none";

                    if (!data.items || data.items.length === 0) {
                        container.textContent = "No upcoming events.";
                        return;
                    }

                    for (var i = 0; i < data.items.length; i++) {
                        var event = data.items[i];
                        var start = event.start.dateTime || event.start.date;
                        var date;

                        if (event.start.dateTime) {
                            date = new Date(start);
                        } else {
                            var parts = start.split("-");
                            date = new Date(
                                Number(parts[0]),
                                Number(parts[1]) - 1,
                                Number(parts[2])
                            );
                        }

                        var item = document.createElement("div");
                        item.className = "calendar-event";

                        var title = document.createElement("strong");
                        title.textContent = event.summary || "Untitled event";

                        var time = document.createElement("div");
                        time.className = "event-time";

                        if (event.start.dateTime) {
                            time.textContent = date.toLocaleString([], {
                                weekday: "short",
                                month: "short",
                                day: "numeric",
                                hour: "numeric",
                                minute: "2-digit"
                            });
                        } else {
                            time.textContent = date.toLocaleDateString([], {
                                weekday: "short",
                                month: "short",
                                day: "numeric"
                            }) + " · All day";
                        }

                        item.appendChild(title);
                        item.appendChild(time);
                        container.appendChild(item);
                    }
                };

                request.onerror = function () {
                    document.getElementById("calendar-events").textContent =
                        "Network error loading calendar.";
                };

                request.send();
            }
        </script>
    </body>
</html>
